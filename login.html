<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Login - Streakify</title>


    </head>
    <body>
        <header>
            <div class="logo">
                STREAKIFY
            </div>
            <nav>
                <a href="index.html" class="home">Home</a>
                <a href="login.html" class="login-register" style="color: #ffffff; font-weight: bold;">Login</a>
                <a href="register.html" class="login-register">Register</a>
            </nav>
        </header>


        <main>


            <form class="habits login-box">
                <h2 id="greeting">Welcome Back</h2>
                <h3>Enter your details below to continue tracking</h3>


                <div class="form-group">
                    <username-password-text>Username</username-password-text><br>
                    <input type="text" id="username"/>
                </div>


                <div class="form-group">
                    <username-password-text>Password</username-password-text><br>
                    <input type="password"/>
                </div>


                <button type="submit">Log In</button>
            </form>
        </body>
    </html>
    <script>
        const usernameInput = document.getElementById('username');
        const greetingText = document.getElementById('greeting');


        usernameInput.addEventListener('input', () => {
            const name = usernameInput.value.trim();
            if (name.length > 0) {
                greetingText.textContent = `Welcome Back, ${name}!`;
            } else {
                greetingText.textContent = 'Welcome Back';
            }
        });
    </script>
