<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">

    <title>Register - Streakify</title>
</head>

<body>
    <header>
        <a href="index.html" class="logo">STREAKIFY</a>

        <nav>
            <a href="index.html" class="login-register">Home</a>
            <a href="login.html" class="login-register">Login</a>
            <a href="register.html"  class="login-register" style="color: #ffffff; font-weight: bold;">Register</a>
        </nav>
        </header>

        <main>
            <div class="habits login-box">
                <!-- Error messages will print here -->
                <p id="message"></p>

                <h2 id="greeting">Create your account</h2>
                <h3>Sign up and start building your streaks</h3>

                <form id="registerForm">
                    <div class="form-group">
                        <username-password-text>Name<br></username-password-text>
                        <input type="text" id="name" autocomplete="off">

                        <br><br>

                        <username-password-text>Username<br></username-password-text>
                        <input type="text" id="registerUsername">

                        <br><br>

                        <username-password-text>Password<br></username-password-text>
                        <input type="password" id="password">

                        <username-password-text><br><br>Confirm Password<br></username-password-text>
                        <input type="password" id="confirmPassword">
                    </div>

                    <br>
                    <button type="submit">Create new account</button>
                </form>
            </div>
        </main>

<script>


    const myForm = document.getElementById('registerForm');
    const usernameInput = document.getElementById('name');
    const greetingText = document.getElementById('greeting');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');

    usernameInput.addEventListener('input', () => {
        const name = usernameInput.value.trim();
        if (name.length > 0) {
            greetingText.textContent = `Create your account, ${name}!`;
        } else {
            greetingText.textContent = 'Create your account';
        }
    });

    myForm.addEventListener('submit', function(event) {
        event.preventDefault();


        const nameValue = usernameInput.value.trim();
        const usernameValue = document.getElementById('registerUsername').value.trim();
        const passwordValue = passwordInput.value;
        const confirmPasswordValue = confirmPasswordInput.value;

        if (!nameValue || !usernameValue || !passwordValue || !confirmPasswordValue) {
            alert('⚠️ Please fill out all fields before submitting.');
            return;
        }



        if (passwordValue !== confirmPasswordValue) {
            alert('❌ Passwords do not match! Please try again.');


            passwordInput.value = '';
            confirmPasswordInput.value = '';
            passwordInput.focus();
            return;

        }

        localStorage.setItem('name', nameValue);
        localStorage.setItem('username', usernameValue);
        localStorage.setItem('password', passwordValue);


        window.location.href = 'index.html';
    });
</script>
